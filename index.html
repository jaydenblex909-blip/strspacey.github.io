<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>str spacey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at top, #0f1a14, #000);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    a { color: #7aa2ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* click to enter */
    #enter {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      font-size: 22px;
      letter-spacing: 2px;
    }

    /* main card */
    .card {
      width: 420px;
      max-width: 90%;
      background: rgba(0,0,0,0.6);
      border-radius: 18px;
      padding: 24px;
      margin: auto;
      margin-top: 10vh;
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid white;
      margin: 10px 0;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .projects button {
      background: transparent;
      border: 1px solid #444;
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      margin: 4px 0;
    }

    .projects button:hover {
      background: #111;
    }

    .socials a {
      display: block;
      margin: 4px 0;
      font-size: 14px;
    }

    /* player */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }

    .progress {
      flex: 1;
      height: 4px;
      background: #333;
      cursor: pointer;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: white;
    }

    .controls {
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }
  </style>
</head>

<body>

<div id="enter">click to enter</div>

<div class="card">
  <div class="profile">
    <h1>hi, i'm str spacey.</h1>
    <img src="pfp.png" alt="profile">
    <h2>projects</h2>
    <div class="projects">
      <button onclick="go('https://docs.google.com/document/d/107QCK9Wyrsb9Ufd03fzfKvwERrIoxA21WBP6xIFCQpE/edit')">
        ultimate games stash
      </button>
    </div>
  </div>

  <div>
    <h2>currently playing</h2>
    <img src="cover.png" style="width:60px;border-radius:8px">
    <p style="margin-top:6px">TEMPO - SUPXR</p>

    <h2 style="margin-top:20px">socials</h2>
    <div class="socials">
      <a href="https://youtube.com/@spaceshipvibers">youtube</a>
      <a href="https://tiktok.com/@luh_a500">tiktok</a>
      <a href="https://discord.com/users/1389074964514082936">discord</a>
      <a href="mailto:jaydenblex909@gmail.com">email</a>
    </div>
  </div>
</div>

<div class="player">
  <div class="controls" id="play">▶</div>
  <img src="cover.png">
  <div class="progress" id="bar"><span></span></div>
</div>

<audio id="audio" src="TEMPO.mp3"></audio>

<script>
  const enter = document.getElementById('enter');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play');
  const bar = document.querySelector('.progress span');

  enter.onclick = () => {
    enter.style.display = 'none';
    audio.play();
    playBtn.textContent = '⏸';
  };

  playBtn.onclick = () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
    } else {
      audio.pause();
      playBtn.textContent = '▶';
    }
  };

  audio.ontimeupdate = () => {
    bar.style.width = (audio.currentTime / audio.duration) * 100 + '%';
  };

  function go(url) {
    window.location.href = url;
  }
</script>

</body>
</html>
