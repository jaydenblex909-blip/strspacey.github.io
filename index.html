<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>str spacey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      text-transform: lowercase;
    }

    body {
      background: radial-gradient(circle at top, #111, #000 70%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* buttons */
    .btn {
      border: 2px solid #fff;
      padding: 10px 22px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: all .2s ease;
      display: inline-block;
    }

    .btn:hover {
      background: #000;
      color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,.4);
    }

    /* layout */
    #app {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      position: absolute;
      max-width: 900px;
      width: 100%;
      padding: 40px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.3rem;
      opacity: .8;
      margin-bottom: 20px;
    }

    .nav {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* home */
    .pfp {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid #fff;
      overflow: hidden;
      margin: 24px auto;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* player */
    .player {
      margin: 30px auto;
      max-width: 420px;
    }

    .cover {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px;
      border: 2px solid #fff;
    }

    .cover.spin img {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress {
      height: 6px;
      background: #222;
      margin: 10px 0;
      cursor: pointer;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    /* project card */
    .card {
      border: 2px solid #fff;
      padding: 30px;
      margin-top: 20px;
      transition: opacity .5s ease;
    }

    .fade-out {
      opacity: 0;
    }

    .back {
      margin-bottom: 20px;
      display: inline-block;
      opacity: .7;
      cursor: pointer;
    }

    .back:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

<audio id="music" src="TEMPO.mp3"></audio>

<div id="app">

  <!-- HOME -->
  <div class="page active" id="home">
    <h1>hi im spacey</h1>
    <h2>currently playing</h2>

    <div class="player">
      <div class="cover" id="cover">
        <img src="cover.png">
      </div>

      <div>tempo — str spacey</div>

      <button class="btn" id="play">pause</button>

      <div class="progress" id="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>

    <div class="pfp">
      <img src="pfp.png">
    </div>

    <div class="nav">
      <button class="btn" onclick="go('projects')">projects</button>
      <button class="btn" onclick="go('socials')">social</button>
    </div>
  </div>

  <!-- PROJECTS -->
  <div class="page" id="projects">
    <div class="back" onclick="go('home')">← back</div>
    <h1>projects</h1>

    <div class="card" id="ugs">
      <h2>ultimate game stash</h2>
      <button class="btn" onclick="openUGS()">view</button>
    </div>
  </div>

  <!-- PROJECT DETAIL -->
  <div class="page" id="ugsPage">
    <div class="back" onclick="go('projects')">← back</div>
    <h1>ultimate game stash</h1>

    <div class="card">
      <p>
        a curated collection of games, resources, and tools built to be fast,
        clean, and accessible anywhere.
      </p>
      <br>
      <a class="btn" target="_blank"
        href="https://docs.google.com/document/d/107QCK9Wyrsb9Ufd03fzfKvwERrIoxA21WBP6xIFCQpE/edit?usp=sharing">
        open project
      </a>
    </div>
  </div>

  <!-- SOCIALS -->
  <div class="page" id="socials">
    <div class="back" onclick="go('home')">← back</div>
    <h1>social</h1>

    <div class="nav">
      <a class="btn" target="_blank" href="https://youtube.com/@spaceshipvibers">youtube</a>
      <a class="btn" target="_blank" href="https://discord.com/users/1389074964514082936">discord</a>
      <a class="btn" href="mailto:jaydenblex909@gmail.com">email</a>
      <a class="btn" target="_blank" href="https://tiktok.com/@luh_a500">tiktok</a>
    </div>
  </div>

</div>

<script>
  const pages = document.querySelectorAll(".page");
  const music = document.getElementById("music");
  const play = document.getElementById("play");
  const bar = document.getElementById("bar");
  const progress = document.getElementById("progress");
  const cover = document.getElementById("cover");

  function go(id) {
    pages.forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function openUGS() {
    document.getElementById("ugs").classList.add("fade-out");
    setTimeout(() => go("ugsPage"), 400);
  }

  play.onclick = () => {
    if (music.paused) {
      music.play();
      play.textContent = "pause";
      cover.classList.add("spin");
    } else {
      music.pause();
      play.textContent = "play";
      cover.classList.remove("spin");
    }
  };

  music.ontimeupdate = () => {
    bar.style.width = (music.currentTime / music.duration) * 100 + "%";
  };

  progress.onclick = e => {
    music.currentTime = (e.offsetX / progress.clientWidth) * music.duration;
  };

  music.play();
  cover.classList.add("spin");
</script>

</body>
</html>
