<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>str spacey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      text-transform: lowercase;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      text-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    /* enter screen */
    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
      z-index: 10;
      font-size: 1.2rem;
    }

    #main {
      display: none;
      padding: 60px 20px;
      height: 100vh;
      overflow-y: auto;
      animation: fade 1s ease forwards;
    }

    @keyframes fade {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    #title {
      font-size: 2.4rem;
      margin-bottom: 26px;
      min-height: 2.8rem;
    }

    .pfp {
      width: 160px;
      height: 160px;
      margin: 0 auto 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      overflow: hidden;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* player */
    .player {
      margin-bottom: 44px;
    }

    .cover {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      border: 2px solid #fff;
      overflow: hidden;
    }

    .spin img {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      width: 100%;
      height: 60px;
      margin: 12px 0;
    }

    .song {
      font-size: 1rem;
    }

    .artist {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .btn {
      border: 2px solid #fff;
      background: none;
      color: #fff;
      padding: 6px 18px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn:hover {
      box-shadow: 0 0 8px rgba(255,255,255,.4);
    }

    .time {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: #222;
      cursor: pointer;
      margin: 10px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .volume {
      width: 100%;
    }

    /* sections */
    .section {
      margin-top: 40px;
      text-align: left;
    }

    .section h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      opacity: 0.75;
    }

    .links a {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }
  </style>
</head>
<body>

<audio id="music" src="TEMPO.mp3"></audio>

<div id="enter">click to enter</div>

<div id="main">
  <div class="container">

    <div id="title"></div>

    <div class="pfp">
      <img src="pfp.png" alt="profile">
    </div>

    <div class="player">
      <div class="cover" id="cover">
        <img src="cover.png" alt="cover">
      </div>

      <canvas id="visualizer"></canvas>

      <div class="song">tempo</div>
      <div class="artist">str spacey</div>

      <button class="btn" id="playPause">pause</button>

      <div class="time">
        <span id="current">0:00</span> / <span id="duration">0:00</span>
      </div>

      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01">
    </div>

    <div class="section">
      <h2>my projects</h2>
      <div class="links">
        <a href="https://docs.google.com/document/d/107QCK9Wyrsb9Ufd03fzfKvwERrIoxA21WBP6xIFCQpE/edit?usp=sharing" target="_blank">
          ultimate games stash
        </a>
      </div>
    </div>

    <div class="section">
      <h2>socials</h2>
      <div class="links">
        <a href="https://youtube.com/@spaceshipvibers" target="_blank">youtube</a>
        <a href="https://discord.com/users/1389074964514082936" target="_blank">discord</a>
        <a href="mailto:jaydenblex909@gmail.com">email</a>
        <a href="https://tiktok.com/@luh_a500" target="_blank">tiktok</a>
      </div>
    </div>

  </div>
</div>

<script>
  const music = document.getElementById("music");
  const playPause = document.getElementById("playPause");
  const progress = document.getElementById("progress");
  const bar = document.getElementById("progressBar");
  const current = document.getElementById("current");
  const duration = document.getElementById("duration");
  const volume = document.getElementById("volume");
  const cover = document.getElementById("cover");

  volume.value = localStorage.volume ?? 1;
  music.volume = volume.value;

  document.getElementById("enter").onclick = () => {
    music.play();
    cover.classList.add("spin");
    setTimeout(() => {
      enter.style.display = "none";
      main.style.display = "block";
      startTitle();
      setupVisualizer();
    }, 2000);
  };

  playPause.onclick = () => {
    if (music.paused) {
      music.play();
      playPause.textContent = "pause";
      cover.classList.add("spin");
    } else {
      music.pause();
      playPause.textContent = "play";
      cover.classList.remove("spin");
    }
  };

  music.onloadedmetadata = () => {
    duration.textContent = fmt(music.duration);
  };

  music.ontimeupdate = () => {
    bar.style.width = (music.currentTime / music.duration) * 100 + "%";
    current.textContent = fmt(music.currentTime);
  };

  progress.onclick = e => {
    music.currentTime = (e.offsetX / progress.clientWidth) * music.duration;
  };

  volume.oninput = () => {
    music.volume = volume.value;
    localStorage.volume = volume.value;
  };

  function fmt(t) {
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  /* title loop */
  const text = "str spacey";
  const title = document.getElementById("title");
  let i = 0, del = false;

  function startTitle() {
    setInterval(() => {
      title.textContent = text.slice(0, i);
      if (!del && i++ >= text.length + 8) del = true;
      if (del && i-- <= 0) del = false;
    }, 120);
  }

  /* visualizer */
  function setupVisualizer() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(music);
    const analyser = ctx.createAnalyser();
    const canvas = document.getElementById("visualizer");
    const c = canvas.getContext("2d");

    src.connect(analyser);
    analyser.connect(ctx.destination);
    analyser.fftSize = 64;

    const data = new Uint8Array(analyser.frequencyBinCount);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(data);
      c.clearRect(0, 0, canvas.width, canvas.height);

      data.forEach((v, i) => {
        const w = canvas.width / data.length;
        c.fillStyle = "#fff";
        c.fillRect(i * w, canvas.height - v / 2, w - 2, v / 2);
      });
    }

    draw();
  }
</script>

</body>
</html>
