<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>str spacey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png">

<!-- quicksand -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Quicksand',sans-serif;
  color:#fff;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0a2a18,#020403 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* click to enter */
#enter{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  cursor:pointer;
  transition:opacity .6s ease;
}
#enter.hidden{opacity:0;pointer-events:none;}

.card{
  width:380px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(18px);
  border-radius:22px;
  padding:26px;
}

.view{
  transition:opacity .35s ease,transform .35s ease;
}
.hidden{
  opacity:0;
  pointer-events:none;
  transform:translateY(10px);
}

h1{
  font-size:20px;
  margin:0 0 14px;
}
h2{
  font-size:14px;
  margin:18px 0 8px;
  opacity:.85;
}
p{
  font-size:12.5px;
  line-height:1.6;
  opacity:.85;
}

button{
  background:transparent;
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:8px 14px;
  font-size:12px;
  cursor:pointer;
  transition:.2s ease;
}
button:hover{
  background:#000;
  border-color:#000;
}

.links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.back{
  font-size:12px;
  opacity:.7;
  cursor:pointer;
  margin-bottom:10px;
}
.back:hover{opacity:1;}

.fade-black{
  position:absolute;
  inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
  z-index:3;
}
.fade-black.active{opacity:1;}

.player{
  display:flex;
  gap:10px;
  align-items:center;
}
.cover{
  width:38px;
  height:38px;
  border-radius:8px;
  background:#222;
}
.song{
  font-size:12px;
  opacity:.85;
}
</style>
</head>

<body>

<!-- click to enter -->
<div id="enter">
  <div>click to enter</div>
</div>

<div class="card">
  <div class="fade-black" id="fade"></div>

  <!-- HOME -->
  <div class="view" id="home">
    <h1>hi, i’m spacey</h1>

    <h2>currently playing</h2>
    <div class="player">
      <div class="cover.png"></div>
      <div class="song">TEMPO - SUPXR</div>
    </div>

    <h2>projects</h2>
    <div class="links">
      <button onclick="openProject()">ultimate games stash</button>
    </div>

    <h2>socials</h2>
    <div class="links">
      <a href="https://youtube.com/@spaceshipvibers">youtube</a>
      <a href="https://tiktok.com/@luh_a500">tiktok</a>
      <a href="https://discord.com/users/1389074964514082936">discord</a>
    </div>
  </div>

  <!-- PROJECT -->
  <div class="view hidden" id="project-preview.png">
    <div class="back" onclick="goHome()">← back</div>
    <h1>ultimate games stash</h1>
    <p>
      a curated collection of games and tools designed to work across
      multiple filters. focused on speed, reliability, and clean design.
    </p>
    <button onclick="window.open('https://docs.google.com/document/d/107QCK9Wyrsb9Ufd03fzfKvwERrIoxA21WBP6xIFCQpE/edit')">
      visit project →
    </button>
  </div>
</div>

<audio id="music" src="TEMPO.mp3" loop></audio>

<script>
const enter = document.getElementById('enter');
const music = document.getElementById('music');
const home = document.getElementById('home');
const project = document.getElementById('project');
const fade = document.getElementById('fade');

enter.onclick = () => {
  enter.classList.add('hidden');
  music.play().catch(()=>{});
};

function openProject(){
  fade.classList.add('active');
  setTimeout(()=>{
    home.classList.add('hidden');
    project.classList.remove('hidden');
    fade.classList.remove('active');
  },300);
}

function goHome(){
  fade.classList.add('active');
  setTimeout(()=>{
    project.classList.add('hidden');
    home.classList.remove('hidden');
    fade.classList.remove('active');
  },300);
}
</script>

</body>
</html>
