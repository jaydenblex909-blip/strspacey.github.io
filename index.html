<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>str spacey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      text-transform: lowercase;
    }

    body {
      background: #ffffff;
      color: #000000;
      height: 100vh;
      overflow: hidden;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* enter screen */
    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      cursor: pointer;
      z-index: 10;
    }

    #enterText {
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    /* main */
    #main {
      display: none;
      height: 100vh;
      overflow-y: auto;
      padding: 60px 20px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    #title {
      font-size: 2.4rem;
      margin-bottom: 30px;
      min-height: 2.8rem;
    }

    .pfp {
      width: 160px;
      height: 160px;
      margin: 0 auto 30px;
      border-radius: 50%;
      border: 3px solid #000;
      overflow: hidden;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .section {
      margin-top: 35px;
      text-align: left;
    }

    .section h2 {
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .links a {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .links a:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <!-- audio -->
  <audio id="bgMusic" src="TEMPO.mp3" loop></audio>

  <!-- enter -->
  <div id="enter">
    <div id="enterText"></div>
  </div>

  <!-- main -->
  <div id="main">
    <div class="container">

      <div id="title"></div>

      <div class="pfp">
        <img src="pfp.png" alt="profile picture">
      </div>

      <div class="section">
        <h2>my projects</h2>
        <div class="links">
          <a href="https://docs.google.com/document/d/107QCK9Wyrsb9Ufd03fzfKvwERrIoxA21WBP6xIFCQpE/edit?usp=sharing" target="_blank">
            ultimate games stash
          </a>
        </div>
      </div>

      <div class="section">
        <h2>socials</h2>
        <div class="links">
          <a href="https://youtube.com/@spaceshipvibers" target="_blank">youtube</a>
          <a href="https://discord.com/users/1389074964514082936" target="_blank">discord</a>
          <a href="mailto:jaydenblex909@gmail.com">email</a>
          <a href="https://tiktok.com/@luh_a500" target="_blank">tiktok</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* enter typewriter */
    const enterMessage = "click to enter...";
    const enterEl = document.getElementById("enterText");
    let ei = 0;

    function typeEnter() {
      if (ei < enterMessage.length) {
        enterEl.textContent += enterMessage.charAt(ei);
        ei++;
        setTimeout(typeEnter, 60);
      }
    }
    typeEnter();

    const music = document.getElementById("bgMusic");

    document.getElementById("enter").addEventListener("click", () => {
      music.play();

      // lock interaction
      document.getElementById("enter").style.pointerEvents = "none";

      // wait 2 seconds before showing profile
      setTimeout(() => {
        document.getElementById("enter").style.display = "none";
        document.getElementById("main").style.display = "block";
        startTitleLoop();
      }, 2000);
    });

    /* looping title */
    const titleText = "str spacey";
    const titleEl = document.getElementById("title");
    let ti = 0;
    let deleting = false;

    function startTitleLoop() {
      setInterval(() => {
        if (!deleting) {
          titleEl.textContent = titleText.slice(0, ti++);
          if (ti > titleText.length + 10) deleting = true;
        } else {
          titleEl.textContent = titleText.slice(0, ti--);
          if (ti < 0) {
            deleting = false;
            ti = 0;
          }
        }
      }, 120);
    }
  </script>

</body>
</html>
