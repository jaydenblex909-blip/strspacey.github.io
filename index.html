<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>str spacey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      text-transform: lowercase;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    #enter {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
      z-index: 10;
    }

    #main {
      display: none;
      padding: 60px 20px;
      height: 100vh;
      overflow-y: auto;
      animation: fade 1s ease forwards;
    }

    @keyframes fade {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    #title {
      font-size: 2.4rem;
      margin-bottom: 30px;
      min-height: 2.8rem;
    }

    .pfp {
      width: 160px;
      height: 160px;
      margin: 0 auto 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      overflow: hidden;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* player */
    .player {
      margin: 30px 0;
    }

    .cover {
      width: 120px;
      height: 120px;
      margin: 0 auto 10px;
      border: 2px solid #fff;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song {
      font-size: 1rem;
    }

    .artist {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .btn {
      border: 2px solid #fff;
      background: none;
      color: #fff;
      padding: 6px 14px;
      cursor: pointer;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: #222;
      cursor: pointer;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
    }
  </style>
</head>
<body>

  <audio id="music" src="TEMPO.mp3"></audio>

  <div id="enter">
    <div>click to enter</div>
  </div>

  <div id="main">
    <div class="container">

      <div id="title"></div>

      <div class="pfp">
        <img src="pfp.png" alt="profile">
      </div>

      <div class="player">
        <div class="cover">
          <img src="cover.png" alt="cover">
        </div>

        <div class="song">tempo</div>
        <div class="artist">supxr</div>

        <div class="controls">
          <button class="btn" id="playPause">play</button>
        </div>

        <div class="progress" id="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const music = document.getElementById("music");
    const playPause = document.getElementById("playPause");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");

    document.getElementById("enter").onclick = () => {
      music.play();
      playPause.textContent = "pause";
      setTimeout(() => {
        document.getElementById("enter").style.display = "none";
        document.getElementById("main").style.display = "block";
        startTitle();
      }, 2000);
    };

    playPause.onclick = () => {
      if (music.paused) {
        music.play();
        playPause.textContent = "pause";
      } else {
        music.pause();
        playPause.textContent = "play";
      }
    };

    music.addEventListener("timeupdate", () => {
      const percent = (music.currentTime / music.duration) * 100;
      progressBar.style.width = percent + "%";
    });

    progress.onclick = (e) => {
      const width = progress.clientWidth;
      const clickX = e.offsetX;
      music.currentTime = (clickX / width) * music.duration;
    };

    const text = "str spacey";
    const title = document.getElementById("title");
    let i = 0;
    let del = false;

    function startTitle() {
      setInterval(() => {
        if (!del) {
          title.textContent = text.slice(0, i++);
          if (i > text.length + 8) del = true;
        } else {
          title.textContent = text.slice(0, i--);
          if (i < 0) { del = false; i = 0; }
        }
      }, 120);
    }
  </script>

</body>
</html>
